<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookNest</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>BookNest</h1>
    <nav>
      <a href="index.html">Catalog</a>
      <a href="book.html">Book details</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Book catalog</h2>
      <div id="book-list"></div>
    </section>
    <section class="add-section">
      <h2>Add a book</h2>
      <form id="add-form" class="add-form">
        <div class="field">
          <label for="book-title">Title</label>
          <input type="text" id="book-title" name="title" required minlength="2" maxlength="100" placeholder="e.g. The Road">
        </div>
        <div class="field">
          <label for="book-author">Author</label>
          <input type="text" id="book-author" name="author" required minlength="2" maxlength="80">
        </div>
        <div class="field">
          <label for="book-year">Year</label>
          <input type="number" id="book-year" name="year" required min="1" max="2026">
        </div>
        <div class="field">
          <label for="book-pages">Pages</label>
          <input type="number" id="book-pages" name="pages" required min="1" max="5000">
        </div>
        <div class="field">
          <label for="book-genre">Genre</label>
          <select id="book-genre" name="genre" required>
            <option value="">Choose a genre</option>
            <option>Fiction</option>
            <option>Dystopia</option>
            <option>Romance</option>
            <option>Fantasy</option>
            <option>Drama</option>
            <option>Science</option>
            <option>Non-fiction</option>
            <option>Science Fiction</option>
            <option>Mystery</option>
          </select>
        </div>
        <div class="field field-check">
          <input type="checkbox" id="book-available" name="available" checked>
          <label for="book-available">Available</label>
        </div>
        <button type="submit">Add book</button>
        <p id="form-message" class="form-message" role="alert"></p>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 BookNest</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/form.js"></script>
</body>
</html>
